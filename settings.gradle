pluginManagement {
    repositories { maven { url = 'https://maven.kikugie.dev/releases' }; maven { url = 'https://maven.fabricmc.net/' }; gradlePluginPortal(); mavenCentral() }
}
plugins { id 'dev.kikugie.stonecutter' version '0.9.8' }
stonecutter {
    create(rootProject) {
        versions '1.21.11', '26.1', '26.2', '26.3'
        vcsVersion = '26.2'
    }
}
rootProject.name = 'keybindProfile'
